<div><label for="fb-{{ f.name }}">{{ f.label }}</label>
  {% if f.kind == "select" %}<select id="fb-{{ f.name }}" name="{{ f.name }}"><option value="">{{ f.any_label }}</option>{% for v, l in f.options %}<option value="{{ v }}" {% if v == f.value %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
  {% elif f.kind == "date" %}<input id="fb-{{ f.name }}" type="date" name="{{ f.name }}" value="{{ f.value }}">
  {% else %}<input id="fb-{{ f.name }}" type="search" name="{{ f.name }}" value="{{ f.value }}" placeholder="{{ f.placeholder }}">{% endif %}
  {% if f.hint %}<div class="hint">{{ f.hint }}</div>{% endif %}</div>
