{% extends "base.html" %}
{% block title %}My details{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>My details</h1>
    <p class="muted">Role: <span class="badge role">{{ user.get_role_display }}</span>
      {% if user.supervisor %} &middot; Supervisor: {{ user.supervisor }}{% endif %}</p>
  </div>
</div>
<div class="card">
  <form method="post" class="stack">
    {% csrf_token %}
    {% include "partials/form.html" %}
    <div class="form-actions"><button class="btn" type="submit">Save changes</button></div>
  </form>
</div>
{% endblock %}
